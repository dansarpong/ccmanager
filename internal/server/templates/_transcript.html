{{define "_transcript.html"}}<div id="transcript-page">
  {{range .Page.Messages}}
  <article class="msg msg-{{.Role}}">
    <header><span class="role">{{.Role}}</span> <span class="ts">{{prettyTime .Timestamp}}</span></header>
    <pre>{{.Text}}</pre>
  </article>
  {{else}}
  <p class="empty">No text messages in this transcript.</p>
  {{end}}

  {{if .Page.HasMore}}
  <button hx-get="/sessions/{{.Session.SessionID}}/transcript?offset={{add .Page.Offset .Page.Limit}}"
          hx-target="#transcript-page" hx-swap="outerHTML">
    Load more ({{.Page.Total}} total)
  </button>
  {{end}}
</div>{{end}}
